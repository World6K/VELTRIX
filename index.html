<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Silver">
<meta name="theme-color" content="#ffffff">
<title>Silver Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0d0f13;--mute:#7b818d;--panel:#f6f7f9;--line:#e9ebef;--in:#0e9f5b;--out:#d4505a;--acc:#2f5bff;
--font:"Manrope",-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);min-height:100dvh;font-feature-settings:"tnum" 1,"lnum" 1}
#app{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 110px)}
.view{display:none}.view.on{display:block}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mute);font-size:13px;font-weight:500;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#2b2f36;background:linear-gradient(135deg,#f3f4f6,#b8bdc4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 2px 8px rgba(20,30,50,.15)}
.back{background:none;border:0;color:var(--ink);font:inherit;font-size:30px;line-height:1;padding:0 12px 0 0;cursor:pointer}
.total{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.dec{color:#a9aeb8}
.total .flag{display:inline-block;width:.78em;height:.58em;margin-left:.28em;vertical-align:.04em;border-radius:5px;box-shadow:0 0 0 1px rgba(13,15,19,.14),0 3px 8px rgba(13,15,19,.18)}
/* Carte Silver Metal */
.card{position:relative;aspect-ratio:1.586;border-radius:20px;padding:20px 22px;overflow:hidden;margin-top:20px;display:flex;flex-direction:column;justify-content:space-between;
background:linear-gradient(135deg,#eceef1 0%,#cdd1d6 42%,#dde0e4 68%,#b9bec5 100%);
box-shadow:0 26px 40px -16px rgba(30,40,64,.45),0 4px 10px rgba(30,40,64,.12),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.14)}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 1px,rgba(60,66,78,.045) 1px 2px,transparent 2px 3px);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 64%,rgba(255,255,255,.3) 100%);pointer-events:none}
.card>*{position:relative;z-index:1}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:20px 20px 56px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.slide{flex:0 0 84%;scroll-snap-align:center}
.slide .card{margin:0}
.cards.tilt .card{transform:rotate(-3deg)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-42px}
.dots button{width:6px;height:6px;border-radius:9px;border:0;background:#d3d6dc;padding:0;cursor:pointer;transition:width .2s,background .2s}
.dots button.on{width:18px;background:var(--ink)}
/* Carte Classic : dégradé aurore */
.card.classic{background:radial-gradient(90% 70% at 15% 0%,rgba(240,190,185,.55) 0%,transparent 65%),linear-gradient(140deg,#dd9795 0%,#cf8584 55%,#c27677 100%);
box-shadow:0 26px 40px -16px rgba(190,95,100,.55),0 4px 10px rgba(30,20,80,.2),inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.2)}
.card.classic::before{background:none}
.card.classic::after{background:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 45%)}
.wht{color:#fff;font-weight:800;letter-spacing:.16em;text-shadow:0 1px 10px rgba(50,10,100,.4)}
.c-top,.c-bot{display:flex;justify-content:space-between;align-items:flex-start}
.chip{width:58px;height:44px}
.eng{color:#9ba1aa;text-shadow:0 1px 0 rgba(255,255,255,.95),0 -1px 0 rgba(50,56,66,.3);font-weight:700;letter-spacing:.16em}
.c-logo{text-align:right;font-size:20px;line-height:1}
.c-logo small{display:block;font-size:9px;letter-spacing:.34em;margin-top:5px}
.c-bot{align-items:flex-end;font-size:12px}
/* Actions */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px 0 4px}
.act{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.act i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.act svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 8px}
.sec .pill{color:var(--in);font-size:12px}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.02em}.sec span{color:var(--mute);font-size:13px;font-weight:600}
/* Transactions */
.tx{display:flex;align-items:center;gap:14px;padding:11px 0;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.logo.white{background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.08)}.logo img{width:62%;height:62%;object-fit:contain}
.logo svg{width:22px;height:22px;fill:none;stroke:#3b4150;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.logo.in{background:#e5f6ed;border-color:#cdeedd}.logo.in svg{stroke:var(--in)}
.tx .m{flex:1;min-width:0}
.tx .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .c{color:var(--mute);font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;flex:none}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.tx .t{color:var(--mute);font-size:12.5px;font-weight:500;margin-top:2px}
/* Panneaux */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:24px;font-weight:800;letter-spacing:-.03em}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:#e5f6ed;color:var(--in)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:9px;background:#f0b4b9;overflow:hidden;margin-top:14px}.bar b{display:block;height:100%;background:var(--in);border-radius:9px}
.kv{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;gap:12px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mute);font-weight:500}
/* Graphique */
.chart{position:relative;margin-top:30px}
.chart svg{display:block;width:100%;height:auto}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 1px rgba(47,91,255,.4),0 2px 8px rgba(47,91,255,.4);transform:translate(-50%,-50%)}
.tip{position:absolute;transform:translate(-50%,-190%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;white-space:nowrap}
.months{display:flex;justify-content:space-between;margin-top:8px}
.months button{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;cursor:pointer}
.months button.on{color:#fff;background:var(--ink)}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:390px;margin:0 20px;margin-inline:auto;height:64px;display:flex;justify-content:space-around;align-items:center;border-radius:32px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(20,30,50,.16)}
@media (max-width:430px){nav{margin-inline:20px}}
nav button{background:none;border:0;width:48px;height:48px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
nav svg{width:24px;height:24px;stroke:#a0a6b1;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke:var(--ink)}
nav button.plus{width:52px;height:52px;background:var(--ink);box-shadow:0 6px 16px rgba(13,15,19,.35)}
nav button.plus svg,nav button.plus.on svg{stroke:#fff;stroke-width:2.2}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
@media (max-width:360px){.total{font-size:34px}.act{font-size:11px}.chip{width:48px;height:36px}}
</style>
</head>
<body>
<div id="app">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-analyze"></section>
  <section class="view" id="v-alerts"></section>
  <section class="view" id="v-profile"></section>
</div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* Logo PlayStation intégré au fichier (pas de chargement externe) : tracé issu de Simple Icons, bleu PlayStation */
const PS_LOGO = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#003791" d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.04 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/></svg>');

/* ===== DONNÉES FICTIVES : modifie tout ici ===== */
const CONFIG = {
  owner: "Antoine MASSA",
  account: "Silver Private",
  balance: 642580.46,
  currency: "CAD",
  status: "Active",
  // Cartes (on les fait glisser). style : silver | classic
  cards: [
    { name: "Silver Metal", style: "silver",  last4: "4821", expiry: "04/29", status: "Active" },
    { name: "Classic",      style: "classic", last4: "7306", expiry: "09/28", status: "Active" }
  ],
  savings: 84250.00,
  // Taux fictif (modifiable) : 1 unité de la devise = X dollars canadiens. Sert aux totaux Revenus/Dépenses.
  rates: { EUR: 1.60 },
  // Courbe d'analyse : solde par mois
  months: ["Oct", "Nov", "Déc", "Janv", "Févr"],
  history: [538000, 561200, 588400, 617900, 642580.46],
  // Transactions. "currency" = devise propre à la transaction (par défaut celle du compte).
  // "logo" = URL ou chemin d'une image (ex. "logos/vival.png" si tu ajoutes le fichier dans ton dépôt).
  // Si l'image ne charge pas, une icône générique prend le relais (icon : game | shop | bike | in | building).
  tx: [
    { name: "PlayStation",   cat: "Gaming",                time: "10:57 PM", amount: -50.00,   icon: "game",     logo: PS_LOGO },
    { name: "Vival",         cat: "Commerce de proximité", time: "5:54 AM",  amount: -12.54,   icon: "shop",     logo: null, currency: "EUR" },
    { name: "Dott",          cat: "Mobilité",              time: "9:33 AM",  amount: -2.50,    icon: "bike",     logo: null, currency: "EUR" },
    { name: "Flexibel Cash", cat: "Virement entrant",      time: "1:40 PM",  amount: 15805.00, icon: "in",       logo: null },
    { name: "CSF THALES",    cat: "Virement entrant",      time: "9:02 PM",  amount: 23601.00, icon: "building", logo: null, currency: "EUR" }
  ]
};
/* ================================================ */

const $ = s => document.querySelector(s);
const nf = (o = {}, c = CONFIG.currency) => new Intl.NumberFormat("fr-CA", { style: "currency", currency: c, ...o });
const eur = (n, c) => nf({}, c).format(n).replace("-", "\u2212");
const eurSigned = (n, c) => nf({ signDisplay: "exceptZero" }, c).format(n).replace("-", "\u2212");
const bigAmt = n => nf().formatToParts(n).map(p => (p.type === "decimal" || p.type === "fraction") ? `<span class="dec">${p.value}</span>` : p.value).join("");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const initials = CONFIG.owner.split(" ").map(w => w[0]).join("").slice(0, 2);

const P = {
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  cards: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10h18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6z"/>',
  analyze: '<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  crypto: '<circle cx="12" cy="12" r="8.5"/><path d="M10 7.5v9M10 7.5h3a2 2 0 0 1 0 4h-3M10 11.5h3.5a2.2 2.2 0 0 1 0 4.5H10M11.5 6v1.5M11.5 16v1.5"/>',
  flux: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  save: '<path d="M4 10c0-3 3-5 8-5s8 2 8 5-3 5-8 5-8-2-8-5zM4 10v5c0 3 3 5 8 5s8-2 8-5v-5"/>',
  game: '<rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4M15.5 12.5h.01M17.5 14.5h.01"/>',
  shop: '<path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M10 20v-6h4v6"/>',
  bike: '<circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-8h5l3 8M9 9H7M14 9l-1-3h-2"/>',
  in: '<path d="M12 4v13M6 12l6 6 6-6M5 21h14"/>',
  building: '<path d="M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M12 10h.01M15 10h.01M9 13h.01M12 13h.01M15 13h.01"/>'
};
const ico = k => `<svg viewBox="0 0 24 24">${P[k]}</svg>`;

// Convertit un montant vers la devise du compte (taux dans CONFIG.rates)
const toBase = t => t.amount * (CONFIG.rates[t.currency] || 1);
const income = CONFIG.tx.filter(t => t.amount > 0).reduce((s, t) => s + toBase(t), 0);
const expense = CONFIG.tx.filter(t => t.amount < 0).reduce((s, t) => s - toBase(t), 0);

function txRow(t) {
  const inn = t.amount > 0;
  const logo = t.logo
    ? `<div class="logo white"><img src="${esc(t.logo)}" alt="${esc(t.name)}" referrerpolicy="no-referrer" data-icon="${t.icon}" data-in="${inn ? 1 : 0}"></div>`
    : `<div class="logo ${inn ? "in" : ""}">${ico(t.icon)}</div>`;
  return `<div class="tx">${logo}
    <div class="m"><div class="n">${esc(t.name)}</div><div class="c">${esc(t.cat)}</div></div>
    <div class="a"><div class="amt ${inn ? "in" : "out"}">${eurSigned(t.amount, t.currency)}</div><div class="t">${esc(t.time)}</div></div></div>`;
}
// Image de logo introuvable : on affiche l'icône générique
document.addEventListener("error", e => {
  const i = e.target;
  if (i.tagName === "IMG" && i.dataset.icon) { const d = i.parentNode; d.className = "logo" + (i.dataset.in === "1" ? " in" : ""); d.innerHTML = ico(i.dataset.icon); }
}, true);

let uid = 0;
const uniq = (str, base) => () => str.split(base).join(base + (++uid));
const flagCA = '<svg class="flag" viewBox="0 0 640 480" role="img" aria-label="Canada"><rect width="640" height="480" fill="#fff"/><path fill="#d52b1e" d="M-19.7 0h169.8v480H-19.7zM490 0h169.8v480H490zM201 232l-13.3 4.4 61.4 54c4.7 13.7-1.6 17.8-5.6 25l66.6-8.4-1.6 67 13.9-.3-3.1-66.6 66.7 8c-4.1-8.7-7.8-13.3-4-27.2l61.3-51-10.7-4c-8.8-6.8 3.8-32.6 5.6-48.9 0 0-35.7 12.3-38 5.8l-9.2-17.5-32.6 35.8c-3.5.9-5-.5-5.9-3.5l15-74.8-23.8 13.4c-2-.4-3.2-1.4-4.4-2.6l-23-46-23.6 47.8c-1.6 1.7-3.4 2.4-5.4 1.4l-22.8-13.4 14.4 75.4c-1.2 3.5-4 4.2-7 2.4l-32-35.6c-4.3 6.3-7.4 17.2-13 19.5-5.5 2-24-4.3-35.5-6.2 4.2 14.8 17.6 39.3 9 47.7z"/></svg>';
const chipTpl = '<svg class="chip" viewBox="0 0 56 42"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f9"/><stop offset="1" stop-color="#b4b9c1"/></linearGradient></defs><rect x="1" y="1" width="54" height="40" rx="8" fill="url(#cg)" stroke="#979da6"/><path d="M1 14h14a6 6 0 0 1 6 6v2a6 6 0 0 1-6 6H1M55 14H41a6 6 0 0 0-6 6v2a6 6 0 0 0 6 6h14M21 1v10M35 1v10M21 41V31M35 41V31M21 21h14" fill="none" stroke="#8b919a"/></svg>';
const chipGoldTpl = '<svg class="chip" viewBox="0 0 56 42"><defs><linearGradient id="cg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdeeb8"/><stop offset="1" stop-color="#c9993f"/></linearGradient></defs><rect x="1" y="1" width="54" height="40" rx="8" fill="url(#cg2)" stroke="#9a7625"/><path d="M1 14h14a6 6 0 0 1 6 6v2a6 6 0 0 1-6 6H1M55 14H41a6 6 0 0 0-6 6v2a6 6 0 0 0 6 6h14M21 1v10M35 1v10M21 41V31M35 41V31M21 21h14" fill="none" stroke="#8a6a22"/></svg>';
const chip = uniq(chipTpl, "cg"), chipGold = uniq(chipGoldTpl, "cg2");
const card = c => {
  const [w1, ...rest] = c.name.toUpperCase().split(" "), tag = rest.join(" ");
  const logo = `${w1}${tag ? `<small>${esc(tag)}</small>` : ""}`;
  const holder = esc(CONFIG.owner.toUpperCase()), num = `•••• ${esc(c.last4)}`;
  return c.style === "classic"
    ? `<div class="card classic"><div class="c-top">${chip()}<div class="c-logo wht">${logo}</div></div><div class="c-bot wht"><span>${holder}</span><span>${num}</span></div></div>`
    : `<div class="card"><div class="c-top">${chip()}<div class="c-logo eng">${logo}</div></div><div class="c-bot eng"><span>${holder}</span><span>${num}</span></div></div>`;
};
let cur = 0;
const carousel = (cls = "") => `<div class="cards ${cls}">${CONFIG.cards.map(c => `<div class="slide">${card(c)}</div>`).join("")}</div>
  <div class="dots">${CONFIG.cards.map((c, i) => `<button data-card="${i}" aria-label="${esc(c.name)}" class="${i === cur ? "on" : ""}"></button>`).join("")}</div>`;
function syncCarousel() {
  document.querySelectorAll(".view.on .cards").forEach(el => {
    const max = el.scrollWidth - el.clientWidth, b = el.style.scrollBehavior;
    el.style.scrollBehavior = "auto"; el.scrollLeft = CONFIG.cards.length > 1 ? cur / (CONFIG.cards.length - 1) * max : 0; el.style.scrollBehavior = b;
  });
}
function updateCardUI() {
  document.querySelectorAll(".dots button").forEach(b => b.classList.toggle("on", +b.dataset.card === cur));
  const c = CONFIG.cards[cur], set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
  set("#d-card", c.name); set("#d-num", "•••• " + c.last4); set("#d-exp", c.expiry); set("#d-st", c.status);
}
let raf;
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("cards")) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const max = el.scrollWidth - el.clientWidth, i = max > 0 ? Math.round(el.scrollLeft / max * (CONFIG.cards.length - 1)) : 0;
    if (i !== cur) { cur = i; updateCardUI(); }
  });
}, true);

const head = (title, sub) => `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="avatar">${initials}</div></div>`;
const sub = title => `<div class="top"><div style="display:flex;align-items:center"><button class="back" data-go="home" aria-label="Retour">‹</button><h1>${title}</h1></div><div class="avatar">${initials}</div></div>`;

function rev() {
  const pct = Math.round(income / (income + expense) * 1000) / 10;
  return `<div class="panel"><div class="grid2">
    <div><div class="sub">Revenus</div><div class="amt in big" style="font-size:18px;margin-top:4px">${eurSigned(income)}</div></div>
    <div><div class="sub">Dépenses</div><div class="amt out big" style="font-size:18px;margin-top:4px">${eurSigned(-expense)}</div></div></div>
    <div class="bar" title="${pct}% de revenus"><b style="width:${Math.max(pct, 2)}%"></b></div></div>`;
}

function renderHome() {
  $("#v-home").innerHTML = `<div class="top"><div><div class="sub">Bonjour, ${esc(CONFIG.owner)}</div></div><div class="avatar">${initials}</div></div>
  <div class="total">${bigAmt(CONFIG.balance)}${flagCA}</div><div class="sub">Solde disponible · ${esc(CONFIG.account)}</div>` + carousel() + `
  <div class="acts">
    <button class="act" data-go="analyze"><i>${ico("analyze")}</i>Analyse</button>
    <button class="act" data-soon><i>${ico("crypto")}</i>Crypto</button>
    <button class="act" data-soon><i>${ico("doc")}</i>Documents</button>
    <button class="act" data-soon><i>${ico("flux")}</i>Flux</button></div>
  <div class="sec"><h2>Épargne</h2><span>Livret</span></div>
  <div class="panel row"><div class="sub" style="margin:0">Total épargné</div><div class="amt big" style="font-size:20px">${eur(CONFIG.savings)}</div></div>
  <div class="sec"><h2>Revenus et dépenses</h2><span>Récent</span></div>${rev()}
  <div class="sec"><h2>Transactions</h2><span>Voir tout</span></div>${CONFIG.tx.map(txRow).join("")}`;
}

function renderCards() {
  $("#v-cards").innerHTML = head("Cartes", esc(CONFIG.account)) + carousel("tilt") + `
  <div class="sec" style="margin-top:34px"><h2>Détails</h2><span class="pill" id="d-st">${esc(CONFIG.cards[cur].status)}</span></div>
  <div class="panel">
    <div class="kv"><span>Compte</span><span>${esc(CONFIG.account)}</span></div>
    <div class="kv"><span>Titulaire</span><span>${esc(CONFIG.owner)}</span></div>
    <div class="kv"><span>Carte</span><span id="d-card">${esc(CONFIG.cards[cur].name)}</span></div>
    <div class="kv"><span>Numéro</span><span id="d-num">•••• ${esc(CONFIG.cards[cur].last4)}</span></div>
    <div class="kv"><span>Expire</span><span id="d-exp">${esc(CONFIG.cards[cur].expiry)}</span></div>
    <div class="kv"><span>Devise</span><span>${esc(CONFIG.currency)}</span></div></div>`;
}

let sel = CONFIG.history.length - 1;
function renderAnalyze() {
  const h = CONFIG.history, n = h.length, W = 320, H = 150;
  const mn = Math.min(...h) * .92, mx = Math.max(...h) * 1.02;
  const pts = h.map((v, i) => [i * W / (n - 1), H - 12 - (v - mn) / (mx - mn) * (H - 40)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < n; i++) { const [px, py] = pts[i - 1], [x, y] = pts[i], m = (px + x) / 2; d += ` C${m},${py} ${m},${y} ${x},${y}`; }
  const [sx, sy] = pts[sel];
  $("#v-analyze").innerHTML = sub("Analyse") + `
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5bff" stop-opacity=".22"/><stop offset="1" stop-color="#2f5bff" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W},${H} L0,${H}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#2f5bff" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div class="dot" style="left:${sx / W * 100}%;top:${sy / H * 100}%"></div>
    <div class="tip" style="left:${Math.min(Math.max(sx / W * 100, 14), 86)}%;top:${sy / H * 100}%">${eur(h[sel]).replace(",00", "")}</div></div>
  <div class="months">${CONFIG.months.map((m, i) => `<button data-m="${i}" class="${i === sel ? "on" : ""}">${esc(m)}</button>`).join("")}</div>
  <div style="text-align:center;margin:26px 0 4px"><div class="sub">Solde total</div><div class="big">${bigAmt(CONFIG.balance)}</div></div>
  <div class="sec"><h2>Revenus et dépenses</h2></div>${rev()}
  <div class="sec"><h2>Transactions</h2></div>${CONFIG.tx.map(txRow).join("")}`;
}

function renderAlerts() {
  const last = CONFIG.tx.filter(t => t.amount > 0).slice(-1)[0];
  $("#v-alerts").innerHTML = head("Alertes", "Activité récente") +
    (last ? `<div class="panel"><div class="kv"><span>${esc(last.name)}</span><span class="amt in">${eurSigned(last.amount, last.currency)}</span></div><div class="sub">Virement reçu à ${esc(last.time)}</div></div>` : "") +
    `<div class="panel" style="margin-top:10px"><div class="sub" style="margin:0">Carte ${esc(CONFIG.cards[cur].name)} •••• ${esc(CONFIG.cards[cur].last4)} : ${esc(CONFIG.cards[cur].status).toLowerCase()}</div></div>`;
}

function renderProfile() {
  $("#v-profile").innerHTML = head("Profil", "Démonstration") + `<div class="panel">
    <div class="kv"><span>Titulaire</span><span>${esc(CONFIG.owner)}</span></div>
    <div class="kv"><span>Compte</span><span>${esc(CONFIG.account)}</span></div>
    <div class="kv"><span>Statut</span><span class="pill">${esc(CONFIG.status)}</span></div></div>
    <p class="sub" style="margin-top:14px;line-height:1.5">Application fictive : aucune banque réelle n'est connectée et aucune authentification n'est simulée.</p>`;
}

const tabs = [["home", "home"], ["cards", "cards"], ["analyze", "plus"], ["alerts", "bell"], ["profile", "user"]];
$("#nav").innerHTML = tabs.map(([v, i]) => `<button data-go="${v}" class="${i === "plus" ? "plus" : ""}" aria-label="${v}">${ico(i)}</button>`).join("");

const render = { home: renderHome, cards: renderCards, analyze: renderAnalyze, alerts: renderAlerts, profile: renderProfile };
function go(v) {
  render[v]();
  document.querySelectorAll(".view").forEach(e => e.classList.toggle("on", e.id === "v-" + v));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
  syncCarousel(); updateCardUI(); scrollTo(0, 0);
}
let tt;
document.addEventListener("click", e => {
  const dc = e.target.closest("[data-card]"), g = e.target.closest("[data-go]"), m = e.target.closest("[data-m]"), s = e.target.closest("[data-soon]");
  if (dc) { const el = document.querySelector(".view.on .cards"); if (el) el.scrollTo({ left: +dc.dataset.card / (CONFIG.cards.length - 1) * (el.scrollWidth - el.clientWidth), behavior: "smooth" }); }
  else if (g) go(g.dataset.go);
  else if (m) { sel = +m.dataset.m; renderAnalyze(); }
  else if (s) { const t = $("#toast"); t.textContent = "Mise à jour en cours…"; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }
});
go("home");
</script>
</body>
</html>
